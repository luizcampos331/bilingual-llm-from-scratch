[project]
name = "bilingual-llm-from-scratch"
version = "0.1.0"
description = "A bilingual (English + Portuguese) LLM built from scratch, documented in a public article series."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["missions"]
pythonpath = ["missions/01-bigram/src"]
addopts = ["--import-mode=importlib"]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["missions/01-bigram/src"]
